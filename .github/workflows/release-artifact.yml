name: Release Artifact

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: operit-android-3
          run-id: 42209458724
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          ls -la
          FILES=$(find . -type f \( -name "*.apk" -o -name "*.aab" \))
          echo "files: $FILES"
          gh release create handleit-build-3 \
            --title "HandleIT build 3 (assembleDebug)" \
            --notes "APK from run 42209458724, debug signed" \
            $FILES || gh release upload handleit-build-3 $FILES --clobber
